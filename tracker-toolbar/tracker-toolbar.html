<!--tracker toolbar html  -->
<div class="tracker-toolbar">
    <label class="sr-only" for="searchText">Search client or project</label>
    <input type="search" id="searchText" placeholder="Search client or project...">
    <label class="sr-only" for="statusFilter">Filter by status</label>
    <select id="statusFilter">
        <option value="All">All statuses</option>
        <option value="Draft">Draft</option>
        <option value="Sent">Sent</option>
        <option value="Follow-up">Follow-up</option>
        <option value="Won">Won</option>
        <option value="Lost">Lost</option>
    </select>
    <button type="button" id="searchButton">Search</button>
</div>
